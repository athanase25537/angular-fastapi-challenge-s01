<section class="auth-page">
  <form class="auth-card wide" [formGroup]="form" (ngSubmit)="submit()">
    <p class="eyebrow">S01 BANK</p><h1>Create your account</h1><p class="subtitle">Your details are secured with your account.</p>
    @if (error()) { <p class="error" role="alert">{{ error() }}</p> }
    <div class="two-columns"><label>First name <input formControlName="first_name" autocomplete="given-name" /></label><label>Last name <input formControlName="last_name" autocomplete="family-name" /></label></div>
    <label>Email <input type="email" formControlName="email" autocomplete="email" /></label>
    <label>Phone number <input type="tel" formControlName="phone_number" autocomplete="tel" /></label>
    <label>Date of birth <input type="date" formControlName="date_of_birth" /></label>
    <div class="two-columns"><label>Password <input type="password" formControlName="password" autocomplete="new-password" /></label><label>Confirm password <input type="password" formControlName="confirmPassword" autocomplete="new-password" /></label></div>
    <button type="submit" [disabled]="loading()">{{ loading() ? 'Creating account…' : 'Create account' }}</button>
    <p class="switch">Already registered? <a routerLink="/login">Sign in</a></p>
  </form>
</section>
